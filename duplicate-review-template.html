<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marble Race Duplicate Review</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#10141c; color:#eef3ff }
    body { margin:0; background:linear-gradient(160deg,#111827,#0b1020 55%,#171127); min-height:100vh }
    header { position:sticky; top:0; z-index:2; padding:20px clamp(16px,4vw,48px); background:#10141ceF; backdrop-filter:blur(12px); border-bottom:1px solid #334155 }
    h1 { margin:0 0 6px; font-size:clamp(22px,3vw,34px) } .sub { color:#aab7cc }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px }
    input,select,button { border:1px solid #46546b; background:#192232; color:#f8fafc; border-radius:9px; padding:9px 11px }
    button { cursor:pointer } button:hover { background:#26354d }
    main { max-width:1200px; margin:auto; padding:24px }
    .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px }
    .pill { background:#1e293b; border:1px solid #334155; border-radius:999px; padding:7px 12px }
    .match { background:#151d2b; border:1px solid #334155; border-radius:14px; padding:18px; margin:14px 0; box-shadow:0 10px 30px #0003 }
    .match.reviewed { opacity:.68 } .match-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start }
    .confidence { font-weight:700; color:#86efac } .medium { color:#fde68a }
    .items { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; margin:14px 0 }
    .item { background:#0f172a; border:1px solid #293548; border-radius:11px; padding:12px; display:grid; grid-template-columns:78px 1fr; gap:12px }
    .item.keep { border-color:#15803d; box-shadow:inset 0 0 0 1px #15803d55 }
    .item.hidden { border-color:#b91c1c; box-shadow:inset 0 0 0 1px #b91c1c55 }
    .choice-label { font-size:12px; font-weight:800 }
    .keep .choice-label { color:#86efac } .hidden .choice-label { color:#fca5a5 }
    .item img { width:78px; height:78px; border-radius:8px; object-fit:cover; background:#263142 }
    .name { font-weight:700 } .meta,.evidence { color:#aab7cc; font-size:13px; line-height:1.45 }
    .oldest { color:#7dd3fc; font-size:12px; font-weight:700 }
    .item-actions { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px }
    .choice-button { font-weight:800; padding:8px }
    .choice-button.keep-choice.selected { background:#166534; border-color:#4ade80 }
    .choice-button.hide-choice.selected { background:#991b1b; border-color:#f87171 }
    .review-progress { border-top:1px solid #334155; padding-top:12px; color:#aab7cc; font-size:13px }
    .campaign-check { margin:13px 0; padding:12px; border:1px solid #46546b; border-radius:10px; background:#111827 }
    .campaign-row { margin-top:9px; padding-top:9px; border-top:1px solid #293548 }
    .complete { color:#86efac; font-weight:700 } .partial { color:#fde68a; font-weight:700 }
    details { margin-top:6px } summary { cursor:pointer; color:#7dd3fc }
    a { color:#7dd3fc } .empty { text-align:center; padding:60px; color:#aab7cc }
  </style>
</head>
<body>
<header>
  <h1>Potential duplicate levels</h1>
  <div class="sub" id="subtitle"></div>
  <div class="toolbar">
    <input id="search" placeholder="Search name, author, or ID">
    <select id="filter"><option value="different-authors">Unresolved different authors</option><option value="unreviewed">All unresolved</option><option value="all">All matches</option><option value="high">Unresolved high confidence</option><option value="reviewed">Resolved/reviewed</option></select>
    <button id="export">Export decisions</button><button id="importButton">Import decisions</button><button id="apply">Apply choices to manager</button><input hidden type="file" id="importFile" accept="application/json"><span id="applyStatus" class="sub"></span>
  </div>
</header>
<main><div class="summary" id="summary"></div><div id="matches"></div></main>
<script>
const report = /*__DUPLICATE_REPORT_DATA__*/;
const storageKey = 'marble-race-duplicate-decisions-v1';
const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
const existingHiddenItemIds = new Set((report.ExistingHiddenItemIds || []).map(Number));
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const date = seconds => new Date(seconds * 1000).toLocaleDateString();
const typeName = value => ['Level','Block','Campaign'][value] || 'Item';
function migrateChoices(data) {
  const choices = {};
  for (const [id,value] of Object.entries(data.ItemChoices || {})) if (value === 'keep' || value === 'hide') choices[Number(id)] = value;
  const legacyDecisions = data.Decisions || (data.SchemaVersion ? {} : data);
  for (const [key,decision] of Object.entries(legacyDecisions || {})) {
    for (const id of decision?.hideIds || []) choices[Number(id)] = 'hide';
    if (decision?.status === 'keep-all') {
      const match = report.Matches.find(candidate => candidate.Key === key);
      for (const item of match?.Items || []) if (!choices[item.Id]) choices[item.Id] = 'keep';
    }
  }
  for (const id of data.HiddenItemIds || []) choices[Number(id)] = 'hide';
  return choices;
}
let itemChoices = migrateChoices(stored);
for (const id of existingHiddenItemIds) itemChoices[id] = 'hide';
function hiddenIds() { return Object.entries(itemChoices).filter(([,choice]) => choice === 'hide').map(([id]) => Number(id)).sort((a,b)=>a-b); }
function isResolved(match) { return match.Items.every(item => itemChoices[item.Id] === 'keep' || itemChoices[item.Id] === 'hide'); }
function persist() { localStorage.setItem(storageKey, JSON.stringify({SchemaVersion:3,ItemChoices:itemChoices,HiddenItemIds:hiddenIds()})); }
function save() { persist(); render(); }
function render() {
  const query = document.querySelector('#search').value.toLowerCase();
  const filter = document.querySelector('#filter').value;
  const visible = report.Matches.filter(match => {
    const resolved = isResolved(match);
    if (filter === 'unreviewed' && resolved) return false;
    if (filter === 'reviewed' && !resolved) return false;
    if (filter === 'high' && (match.Confidence < 94 || resolved)) return false;
    if (filter === 'different-authors' && (!match.DifferentAuthors || resolved)) return false;
    return !query || match.Items.some(item => (item.Name + ' ' + item.AuthorName + ' ' + item.Id).toLowerCase().includes(query));
  });
  document.querySelector('#subtitle').textContent = report.Scope + ' • generated ' + new Date(report.GeneratedAt).toLocaleString();
  const resolvedCount = report.Matches.filter(isResolved).length;
  const decidedCount = Object.values(itemChoices).filter(choice => choice === 'keep' || choice === 'hide').length;
  document.querySelector('#summary').innerHTML = [report.Stats.ScannedItems + ' items scanned', report.Stats.PotentialDuplicateGroups + ' groups', report.Stats.CrossAuthorGroups + ' different-author groups', hiddenIds().length + ' items marked HIDE', resolvedCount + ' fully decided groups', decidedCount + ' item choices saved'].map(x => '<span class="pill">' + esc(x) + '</span>').join('');
  document.querySelector('#matches').innerHTML = visible.length ? visible.map(matchHtml).join('') : '<div class="empty">No matches in this view.</div>';
  document.querySelectorAll('[data-choice]').forEach(button => button.onclick = event => {
    const [idText,choice] = event.currentTarget.dataset.choice.split('|'); const id = Number(idText);
    if (itemChoices[id] === choice) delete itemChoices[id]; else itemChoices[id] = choice;
    save();
  });
}
function matchHtml(match) {
  const reviewed = isResolved(match);
  const decided = match.Items.filter(item => itemChoices[item.Id] === 'keep' || itemChoices[item.Id] === 'hide').length;
  const evidence = match.Components.length ? match.Components.map(c => '#' + c.ItemId + ': ' + c.Path + ' (' + c.TokenCount + ' objects)').join(' • ') : 'Whole archive match';
  return '<section class="match ' + (reviewed?'reviewed':'') + '"><div class="match-head"><div><div class="confidence ' + (match.Confidence<94?'medium':'') + '">' + match.Confidence + '% confidence' + (match.DifferentAuthors?' • DIFFERENT AUTHORS':'') + '</div><strong>' + esc(match.Reason) + '</strong></div><div>#' + esc(match.Key) + '</div></div><div class="items">' + match.Items.map(item => itemHtml(item,match)).join('') + '</div><div class="evidence">Matched evidence: ' + esc(evidence) + '</div>' + campaignHtml(match) + '<div class="review-progress">' + (reviewed ? 'Complete' : decided + ' of ' + match.Items.length + ' items decided') + '</div></section>';
}
function campaignHtml(match) {
  if (!match.CampaignComparisons || !match.CampaignComparisons.length) return '';
  return '<div class="campaign-check"><strong>Whole-campaign comparison against oldest upload #' + match.OldestItemId + '</strong><div class="meta">A match above may cover only one contained level. This section checks every level.</div>' + match.CampaignComparisons.map(comparisonHtml).join('') + '</div>';
}
function comparisonHtml(c) {
  const status = c.CompleteMatch ? '<span class="complete">COMPLETE CAMPAIGN MATCH</span>' : '<span class="partial">PARTIAL MATCH</span>';
  const changed = c.Changed.map(x => x.Name + ' (' + x.GeometrySimilarity + '% geometry)').join(', ') || 'None';
  const renamed = c.Renamed.map(x => x.From + ' → ' + x.To).join(', ') || 'None';
  return '<div class="campaign-row">' + status + ' — #' + c.CandidateItemId + ': ' + c.MatchingLevelCount + ' matching of ' + c.BaseLevelCount + ' oldest levels; this upload contains ' + c.CandidateLevelCount + ' levels.<details><summary>Show level differences</summary><div class="meta"><b>Changed:</b> ' + esc(changed) + '<br><b>Added in this upload:</b> ' + esc(c.Added.join(', ') || 'None') + '<br><b>Missing from this upload:</b> ' + esc(c.Missing.join(', ') || 'None') + '<br><b>Renamed but matching:</b> ' + esc(renamed) + '</div></details></div>';
}
function itemHtml(item,match) {
  const steam = item.SteamWorkshopId ? '<a target="_blank" href="https://steamcommunity.com/sharedfiles/filedetails/?id=' + encodeURIComponent(item.SteamWorkshopId) + '">Steam page</a>' : '';
  const choice = itemChoices[item.Id] || '';
  const label = choice ? '<br><span class="choice-label">MARKED ' + choice.toUpperCase() + ' EVERYWHERE</span>' : '';
  return '<article class="item ' + (choice==='hide'?'hidden':choice) + '"><img loading="lazy" src="' + esc(item.PreviewUri) + '"><div><div class="name">' + esc(item.Name) + '</div><div class="meta">#' + item.Id + ' • ' + typeName(item.ResourceType) + '<br>by ' + esc(item.AuthorName) + '<br>' + date(item.TimeStamp) + ' ' + (item.Id===match.OldestItemId?'<span class="oldest">OLDEST UPLOAD</span>':'') + label + '<br>' + steam + '</div></div><div class="item-actions"><button class="choice-button keep-choice ' + (choice==='keep'?'selected':'') + '" data-choice="' + item.Id + '|keep">KEEP</button><button class="choice-button hide-choice ' + (choice==='hide'?'selected':'') + '" data-choice="' + item.Id + '|hide">HIDE</button></div></article>';
}
document.querySelector('#search').oninput = render; document.querySelector('#filter').onchange = render;
document.querySelector('#export').onclick = () => { const blob = new Blob([JSON.stringify({SchemaVersion:3,ExportedAt:new Date().toISOString(),ItemChoices:itemChoices,HiddenItemIds:hiddenIds()},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='marble-duplicate-decisions.json'; a.click(); URL.revokeObjectURL(a.href); };
document.querySelector('#importButton').onclick = () => document.querySelector('#importFile').click();
document.querySelector('#importFile').onchange = async event => { const data=JSON.parse(await event.target.files[0].text()); itemChoices=migrateChoices(data); for (const id of existingHiddenItemIds) if (!itemChoices[id]) itemChoices[id]='hide'; event.target.value=''; save(); };
const managerToken = new URL(location.href).searchParams.get('token') || '';
const applyButton = document.querySelector('#apply');
const applyStatus = document.querySelector('#applyStatus');
if (location.protocol === 'file:' || !managerToken) { applyButton.disabled = true; applyButton.title = 'Open this report from Workshop Manager to apply choices automatically.'; }
applyButton.onclick = async () => {
  if (!managerToken) return;
  applyButton.disabled = true; applyStatus.textContent = 'Applying…';
  try {
    const response = await fetch('/api/duplicate-hidden', {method:'POST',headers:{'content-type':'application/json','x-manager-token':managerToken},body:JSON.stringify({hiddenItemIds:hiddenIds(),itemChoices:itemChoices})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Manager rejected the hidden items.');
    applyStatus.textContent = result.message + ' Return to the manager and click Publish changes.';
  } catch (error) { applyStatus.textContent = error.message || String(error); }
  finally { applyButton.disabled = false; }
};
render();
</script>
</body>
</html>
