<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8f2ff">
    <meta name="description" content="Browse levels, campaigns, and assets from the Marble Race Workshop.">
    <title>Marble Race Workshop</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#catalog">Skip to workshop items</a>
    <header class="site-header">
      <div class="brand">
        <span class="brand-marble" aria-hidden="true"></span>
        <div>
          <h1 id="page-title">Marble Race Workshop</h1>
          <p>Browse levels, campaigns, and assets. Every item shows its ID.</p>
        </div>
      </div>
      <div class="item-total" aria-live="polite"><strong id="total-count">—</strong><span>items</span></div>
    </header>

    <main>
      <section class="catalog-shell" id="catalog" aria-labelledby="page-title">
        <p id="result-count" class="result-count" aria-live="polite">Loading workshop…</p>
        <form class="toolbar" id="filter-form" role="search">
          <label class="search-box">
            <span class="visually-hidden">Search workshop items</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
            <input id="search" name="q" type="search" autocomplete="off" placeholder="Search name, creator, or ID…">
            <kbd>/</kbd>
          </label>
          <label class="select-field"><span>Type</span><select id="type-filter" name="type">
            <option value="all">All items</option><option value="0">Levels</option><option value="2">Campaigns</option><option value="1">Assets</option>
          </select></label>
          <label class="select-field"><span>Sort</span><select id="sort-filter" name="sort">
            <option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name A–Z</option><option value="author">Creator A–Z</option><option value="id-asc">ID: low to high</option><option value="id-desc">ID: high to low</option>
          </select></label>
        </form>

        <div id="status" class="status" role="status"><span class="loader" aria-hidden="true"></span><span>Loading the workshop archive…</span></div>
        <div id="item-grid" class="item-grid" aria-live="polite"></div>
        <div class="load-more-wrap"><button id="load-more" class="load-more" type="button" hidden>Show more items</button></div>
      </section>
    </main>

    <footer><p>Marble Race Workshop</p><p><a href="/api/Items?limit=1000">View API</a></p></footer>
    <dialog id="item-dialog" class="item-dialog" aria-labelledby="dialog-name"><button class="dialog-close" id="dialog-close" type="button" aria-label="Close item details">×</button><div id="dialog-content"></div></dialog>
    <noscript><div class="noscript">JavaScript is needed for the visual catalog. You can still <a href="/api/Items?limit=1000">view the raw workshop list</a>.</div></noscript>
  </body>
</html>
